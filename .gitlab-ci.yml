stages:
  - build
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x ./gradlew

build:
  stage: build
  image: openjdk:17-jdk
  script:
    # Inject API configuration from GitLab CI/CD variables into local.properties.
    # BuildConfig (composeApp/build.gradle.kts) reads these at build time.
    - |
      cat > local.properties <<EOF
      SHEET_SCHEMA=${SHEET_SCHEMA:?SHEET_SCHEMA CI variable is required}
      SPREADSHEET_ID=${SPREADSHEET_ID}
      GOOGLE_API_KEY=${API_KEY}
      SHEET_RANGE=${SHEET_RANGE:-'Data Dump'!A:H}
      SCRIPT_URL=${SCRIPT_URL}
      WRITE_SPREADSHEET_ID=${WRITE_SPREADSHEET_ID}
      WRITE_SCRIPT_URL=${WRITE_SCRIPT_URL}
      OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      EOF
    
    # Build the web distribution
    - ./gradlew :composeApp:jsBrowserDistribution
    
    # Prepare public directory for GitLab Pages
    - mkdir -p public
    - cp -r composeApp/build/dist/js/productionExecutable/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 hour
  only:
    - main
    - master

pages:
  stage: deploy
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public
  dependencies:
    - build
  only:
    - main
    - master