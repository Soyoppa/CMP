<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Treasurer</title>

    <link rel="icon" type="image/png" href="app_logo.png">
    <link rel="apple-touch-icon" href="app_logo.png">
    <link rel="manifest" href="manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Treasurer">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FCFAF6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0C3B2E" media="(prefers-color-scheme: dark)">

    <link type="text/css" rel="stylesheet" href="styles.css">

    <!--
      JS bridges called from wasmJsMain (window.__financeAi/Auth/Flags/Db, window.__voiceInput).
      All three are deferred, so they run in document order after parsing: the bridges always exist
      before the app starts. No inline scripts — the hosting CSP forbids them.
    -->
    <script type="module" src="firebase-bridge.js"></script>
    <script src="voice-bridge.js" defer></script>
    <script src="composeApp.js" defer></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
