<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Transaction Logger</title>

    <link rel="icon" type="image/png" href="app_logo.png">
    <link rel="apple-touch-icon" href="app_logo.png">
    <link rel="manifest" href="manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FCFAF6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0C3B2E" media="(prefers-color-scheme: dark)">

    <link type="text/css" rel="stylesheet" href="styles.css">

    <!--
      Firebase AI Logic bridge for the Kotlin/wasmJs app.
      Exposes window.__financeAi.{init, generate}; called from FirebaseAiProvider (wasmJsMain).
      Uses the Gemini Developer API backend (free tier). The Gemini key stays server-side —
      only the non-secret Firebase web config is passed in from the app at runtime.
    -->
    <script type="module">
      const SDK = "https://www.gstatic.com/firebasejs/12.13.0";
      window.__financeAi = {
        _ai: null,
        _lib: null,
        _ready: null,
        /** Lazily loads firebase/app + firebase/ai and initialises the AI Logic backend. */
        init(configJson) {
          if (this._ready) return this._ready;
          const config = JSON.parse(configJson);
          this._ready = (async () => {
            const appMod = await import(`${SDK}/firebase-app.js`);
            const aiMod = await import(`${SDK}/firebase-ai.js`);
            this._lib = aiMod;
            // Share a single Firebase app instance with the auth bridge.
            const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(config);
            this._ai = aiMod.getAI(app, { backend: new aiMod.GoogleAIBackend() });
            // Ready — no console.log; avoid leaking SDK/backend hints to devtools.
            return true;
          })().catch((e) => {
            // Do NOT log `e` directly — Firebase SDK errors can embed the apiKey or
            // project config in their message/stack on some SDK versions.
            console.error("[financeAi] init failed");
            this._ready = null; // allow a later retry
            throw e;
          });
          return this._ready;
        },
        /** One budget-aware chat turn. Returns JSON: { text, promptTokens, responseTokens, totalTokens }. */
        async generate(model, systemPrompt, historyJson, userMessage) {
          if (!this._ready) throw new Error("financeAi not initialized");
          await this._ready;
          const history = JSON.parse(historyJson);
          const genModel = this._lib.getGenerativeModel(this._ai, {
            model: model,
            systemInstruction: systemPrompt,
          });
          const chat = genModel.startChat({ history: history });
          const result = await chat.sendMessage(userMessage);
          const resp = result.response;
          const usage = (resp && resp.usageMetadata) || {};
          return JSON.stringify({
            text: resp.text(),
            promptTokens: usage.promptTokenCount || 0,
            responseTokens: usage.candidatesTokenCount || 0,
            totalTokens: usage.totalTokenCount || 0,
          });
        },
      };
    </script>

    <!--
      Firebase Auth bridge. Exposes window.__financeAuth.{init, signIn, signUp, guest, signOut};
      called from FirebaseAuthRepository (wasmJsMain). Email/Password + Anonymous (guest) providers,
      with browserLocalPersistence so sessions survive restarts until explicit sign-out.
    -->
    <script type="module">
      const SDK = "https://www.gstatic.com/firebasejs/12.13.0";
      window.__financeAuth = {
        _auth: null,
        _lib: null,
        _ready: null,
        _ensure(configJson) {
          if (this._ready) return this._ready;
          const config = JSON.parse(configJson);
          this._ready = (async () => {
            const appMod = await import(`${SDK}/firebase-app.js`);
            const authMod = await import(`${SDK}/firebase-auth.js`);
            this._lib = authMod;
            const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(config);
            this._auth = authMod.getAuth(app);
            try { await authMod.setPersistence(this._auth, authMod.browserLocalPersistence); } catch (e) {}
            return true;
          })();
          return this._ready;
        },
        _user(u) {
          return JSON.stringify({
            signedIn: !!u,
            email: (u && u.email) || null,
            isGuest: !!(u && u.isAnonymous),
            uid: (u && u.uid) || null,
          });
        },
        _friendly(e) {
          const code = (e && e.code) || "";
          const map = {
            "auth/invalid-credential": "Wrong email or password.",
            "auth/invalid-email": "That email looks invalid.",
            "auth/user-not-found": "No account with that email.",
            "auth/wrong-password": "Wrong email or password.",
            "auth/email-already-in-use": "That email is already registered.",
            "auth/weak-password": "Password must be at least 6 characters.",
            "auth/too-many-requests": "Too many attempts — try again later.",
            "auth/operation-not-allowed": "Email/Password sign-in isn't enabled in Firebase.",
            "auth/admin-restricted-operation": "Guest mode (Anonymous auth) isn't enabled in Firebase.",
          };
          // Do NOT fall back to e.message — it can carry internal Firebase details
          // (including the submitted email address in some SDK versions).
          return map[code] || "Authentication failed.";
        },
        // Resolves once the persisted auth state is known (first onAuthStateChanged emission).
        async init(configJson) {
          await this._ensure(configJson);
          const authMod = this._lib, auth = this._auth;
          const user = await new Promise((resolve) => {
            const unsub = authMod.onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
          });
          return this._user(user);
        },
        async signIn(email, password) {
          await this._ready;
          try {
            const cred = await this._lib.signInWithEmailAndPassword(this._auth, email, password);
            return this._user(cred.user);
          } catch (e) { throw new Error(this._friendly(e)); }
        },
        async signUp(email, password) {
          await this._ready;
          try {
            const cred = await this._lib.createUserWithEmailAndPassword(this._auth, email, password);
            return this._user(cred.user);
          } catch (e) { throw new Error(this._friendly(e)); }
        },
        async guest() {
          await this._ready;
          try {
            const cred = await this._lib.signInAnonymously(this._auth);
            return this._user(cred.user);
          } catch (e) { throw new Error(this._friendly(e)); }
        },
        async signOut() {
          await this._ready;
          await this._lib.signOut(this._auth);
          return "ok";
        },
      };
    </script>

    <!--
      Firebase Remote Config bridge. Exposes window.__financeFlags.get(configJson);
      called from RemoteConfigRepository (wasmJsMain). Acts as a remote kill-switch for UI
      features (sign-up, guest mode, chat). Defaults below are the "fail-open" values used
      before the first successful fetch or if Remote Config is unreachable.
    -->
    <script type="module">
      const SDK = "https://www.gstatic.com/firebasejs/12.13.0";
      const DEFAULTS = { signup_enabled: true, guest_mode_enabled: true, chat_enabled: true };
      window.__financeFlags = {
        _rc: null,
        _lib: null,
        _ready: null,
        _ensure(configJson) {
          if (this._ready) return this._ready;
          const config = JSON.parse(configJson);
          this._ready = (async () => {
            const appMod = await import(`${SDK}/firebase-app.js`);
            const rcMod = await import(`${SDK}/firebase-remote-config.js`);
            this._lib = rcMod;
            const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(config);
            const rc = rcMod.getRemoteConfig(app);
            // Kill-switch latency: how stale a cached value may be before a refetch. 10 min.
            rc.settings.minimumFetchIntervalMillis = 600000;
            rc.defaultConfig = DEFAULTS;
            this._rc = rc;
            return true;
          })();
          return this._ready;
        },
        /** Fetches+activates, then returns JSON of the boolean flags. Falls back to DEFAULTS on error. */
        async get(configJson) {
          try {
            await this._ensure(configJson);
            await this._lib.fetchAndActivate(this._rc);
            return JSON.stringify({
              signup_enabled: this._lib.getValue(this._rc, "signup_enabled").asBoolean(),
              guest_mode_enabled: this._lib.getValue(this._rc, "guest_mode_enabled").asBoolean(),
              chat_enabled: this._lib.getValue(this._rc, "chat_enabled").asBoolean(),
            });
          } catch (e) {
            // Do NOT log `e` directly — Firebase SDK errors can embed config details.
            console.error("[financeFlags] fetch failed, using defaults");
            return JSON.stringify(DEFAULTS);
          }
        },
      };
    </script>

    <!--
      Firebase Cloud Firestore bridge. Exposes window.__financeDb.{get, set};
      called from FirebaseBudgetStore (wasmJsMain) to persist per-user budgets at
      users/{uid}/settings/budget. Shares the single Firebase app with the auth/AI bridges.
      The firestore SDK is imported lazily on first use, so it adds no startup cost.
    -->
    <script type="module">
      const SDK = "https://www.gstatic.com/firebasejs/12.13.0";
      window.__financeDb = {
        _db: null,
        _lib: null,
        _ready: null,
        _ensure(configJson) {
          if (this._ready) return this._ready;
          const config = JSON.parse(configJson);
          this._ready = (async () => {
            const appMod = await import(`${SDK}/firebase-app.js`);
            const fsMod = await import(`${SDK}/firebase-firestore.js`);
            this._lib = fsMod;
            const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(config);
            this._db = fsMod.getFirestore(app);
            return true;
          })().catch((e) => {
            console.error("[financeDb] init failed", e);
            this._ready = null; // allow a later retry
            throw e;
          });
          return this._ready;
        },
        _ref(uid) {
          // users/{uid}/settings/budget
          return this._lib.doc(this._db, "users", uid, "settings", "budget");
        },
        /** Reads the budget doc. Returns the stored JSON object as a string, or "{}" if absent. */
        async get(configJson, uid) {
          await this._ensure(configJson);
          const snap = await this._lib.getDoc(this._ref(uid));
          return JSON.stringify(snap.exists() ? snap.data() : {});
        },
        /** Writes (merges) the budget doc from a JSON string of { bucket: amount, ... }. */
        async set(configJson, uid, dataJson) {
          await this._ensure(configJson);
          const data = JSON.parse(dataJson);
          await this._lib.setDoc(this._ref(uid), data, { merge: true });
          return "ok";
        },
      };
    </script>

    <!--
      Web Speech API bridge for voice transaction entry. Exposes
      window.__voiceInput.{supported, listen, stop}; called from WebSpeechVoiceInputController
      (wasmJsMain). One-shot recognition: listen() resolves with the final transcript (or an error
      code) when the session ends, so the Kotlin side can await it like any other Promise.
    -->
    <script>
      window.__voiceInput = {
        _rec: null,
        supported() {
          return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
        },
        /** Returns Promise<JSON string> of { transcript, error }. error is "" on success. */
        listen(lang) {
          return new Promise((resolve) => {
            const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Ctor) { resolve(JSON.stringify({ transcript: "", error: "unsupported" })); return; }
            let settled = false;
            const done = (payload) => {
              if (settled) return;
              settled = true;
              this._rec = null;
              resolve(JSON.stringify(payload));
            };
            const rec = new Ctor();
            this._rec = rec;
            rec.lang = lang || "en-US";
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            let finalText = "";
            rec.onresult = (e) => {
              for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
              }
            };
            rec.onerror = (e) => done({ transcript: finalText.trim(), error: (e && e.error) || "error" });
            rec.onend = () => {
              const t = finalText.trim();
              done({ transcript: t, error: t ? "" : "no-speech" });
            };
            try { rec.start(); } catch (err) { done({ transcript: "", error: String(err) }); }
          });
        },
        stop() {
          if (this._rec) { try { this._rec.stop(); } catch (e) {} }
        },
      };
    </script>

    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
